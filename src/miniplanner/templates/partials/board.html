{% for column in columns %}
    {% include "partials/column.html" %}
{% endfor %}

{% if edit == ('new-person', 0) %}
    <section class="flex min-w-64 flex-1 flex-col border-r border-line/30">
        <header class="flex h-24 shrink-0 items-center justify-center border-b border-line/30 px-4">
            <form hx-post="/people" hx-target="#board" hx-swap="innerHTML" class="w-full">
                <input name="name" data-autofocus data-commit autocomplete="off" placeholder="nom"
                       aria-label="Nom de la personne"
                       hx-get="/board" hx-trigger="keyup[key=='Escape']"
                       hx-target="#board" hx-swap="innerHTML"
                       class="w-full bg-transparent text-center text-lg
                              placeholder:text-line/40 focus:outline-none">
            </form>
        </header>
    </section>
{% else %}
    <section class="flex w-14 shrink-0 flex-col border-r border-line/30">
        <header class="flex h-24 shrink-0 items-center justify-center border-b border-line/30">
            <button hx-get="/people/new" hx-target="#board" hx-swap="innerHTML"
                    aria-label="Ajouter une personne"
                    class="text-2xl leading-none text-line/50 transition hover:text-ink">+</button>
        </header>
    </section>
{% endif %}
