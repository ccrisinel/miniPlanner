[project]
name = "miniplanner"
version = "0.1.0"
description = "Un tableau minimaliste pour voir qui bosse sur quoi"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "ccrisinel", email = "c.crisinel@gmail.com" }]
dependencies = [
    "flask>=3.1.3",
]

[project.urls]
Homepage = "https://github.com/ccrisinel/miniPlanner"
Repository = "https://github.com/ccrisinel/miniPlanner"

[project.scripts]
miniplanner = "miniplanner:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
